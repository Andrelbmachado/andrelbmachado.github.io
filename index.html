<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>André Machado | Portfolio 3D</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="hud">
      <div id="crosshair" aria-hidden="true"></div>
      <div id="hint">Clique para entrar • WASD para mover • Mouse para olhar</div>
      <button id="enterButton" type="button">Entrar no Portfólio</button>
    </div>

    <div id="panel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div class="panel-card">
        <div class="panel-header">
          <h2 id="panelTitle">Seção</h2>
          <button id="closePanel" class="panel-close" type="button" aria-label="Fechar painel">✕</button>
        </div>
        <div id="panelBody" class="panel-body"></div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
