<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Sunset Drive">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="1" stop-color="#6d1b5c"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe259"/><stop offset=".55" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff2d7a"/></linearGradient>
    <clipPath id="badge"><rect x="4" y="4" width="112" height="112" rx="26"/></clipPath>
    <clipPath id="sunClip"><rect x="0" y="0" width="120" height="70"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="120" height="120" fill="url(#sky)"/>
    <g clip-path="url(#sunClip)">
      <circle cx="60" cy="66" r="32" fill="url(#sun)"/>
      <g fill="#4a0f52">
        <rect x="20" y="50" width="80" height="3"/><rect x="20" y="57" width="80" height="4"/><rect x="20" y="64" width="80" height="5"/>
      </g>
    </g>
    <rect y="70" width="120" height="50" fill="#12051f"/>
    <path d="M52 70 L68 70 L100 120 L20 120 Z" fill="#1d0b30"/>
    <g stroke="#ff4fa3" stroke-width="1.4" fill="none" opacity=".85">
      <line x1="0" y1="70" x2="120" y2="70"/>
      <line x1="52" y1="70" x2="20" y2="120"/><line x1="68" y1="70" x2="100" y2="120"/>
      <line x1="44" y1="70" x2="-10" y2="120"/><line x1="76" y1="70" x2="130" y2="120"/>
      <line x1="0" y1="80" x2="120" y2="80"/><line x1="0" y1="94" x2="120" y2="94"/>
    </g>
    <g fill="#ffe259"><rect x="59" y="76" width="2" height="5"/><rect x="58.5" y="88" width="3" height="8"/><rect x="58" y="104" width="4" height="12"/></g>
  </g>
  <rect x="4" y="4" width="112" height="112" rx="26" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>
